name: Live watcher

# Always on: reads the streamers' live chats and, when one explodes, starts
# "Clip now" for that moment (see watcher.py). GitHub ends a run after about
# 6 hours, so it's started every hour: while one run is watching, the next
# waits in line and takes over the second it ends. Nothing to fill in.
# Turn it off with live.enabled: false in config.yaml.
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: read    # to see who already got a Short today (state.json)
  actions: write    # to start "Clip now"

concurrency:
  group: watcher
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests pyyaml tzdata
      - name: Watch chats
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONUNBUFFERED: "1"
        run: python watcher.py
