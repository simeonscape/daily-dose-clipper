name: Clip now

# Started by the Live watcher when a stream's chat explodes: cuts that moment
# from the stream's live VOD, edits it (blur, subtitles, layout) and posts it,
# unless the streamer already has a Short today. With live.post: false in
# config.yaml it only makes the video (download it from the run's Artifacts).
on:
  workflow_dispatch:
    inputs:
      streamer:
        description: "Twitch login"
        required: true
      vod:
        description: "Live VOD id (empty = find it)"
        default: ""
      t:
        description: "Seconds into the stream"
        required: true
      rate:
        description: "Chats/min per 1,000 viewers (for the log)"
        default: ""
      viewers:
        description: "Viewers (for the log)"
        default: ""
      chat_z:
        description: "Chat z-score (for the log)"
        default: ""

run-name: "Clip now: ${{ inputs.streamer }} (${{ inputs.rate }}/min per 1,000)"

permissions:
  contents: write   # to save state.json

concurrency:
  group: clip-now-${{ inputs.streamer }}
  cancel-in-progress: false

jobs:
  clip:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg
        timeout-minutes: 5
        run: |
          # A ready-made ffmpeg build (with subtitles support). Much faster than apt-get.
          curl -sSL --retry 3 -o ffmpeg.tar.xz https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
          mkdir -p "$HOME/ffmpeg" && tar -xf ffmpeg.tar.xz -C "$HOME/ffmpeg" --strip-components=1
          echo "$HOME/ffmpeg/bin" >> "$GITHUB_PATH"
          "$HOME/ffmpeg/bin/ffmpeg" -hide_banner -filters | grep -q subtitles

      - name: Install Python packages
        timeout-minutes: 10
        run: pip install -r requirements.txt

      - name: Install TwitchDownloaderCLI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download -R lay295/TwitchDownloader -p "*CLI*Linux-x64.zip" -O tdl.zip
          unzip -o tdl.zip TwitchDownloaderCLI && chmod +x TwitchDownloaderCLI

      - name: Install Claude Code (only if you added CLAUDE_CODE_OAUTH_TOKEN)
        env:
          HAS_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        if: env.HAS_TOKEN == 'true'
        run: npm install -g @anthropic-ai/claude-code

      - name: Cache subtitle model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small

      - name: Make and post the Short
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          TWITCHDOWNLOADER_CLI: ./TwitchDownloaderCLI
          PYTHONUNBUFFERED: "1"
          STREAMER: ${{ inputs.streamer }}
          VOD: ${{ inputs.vod }}
          T: ${{ inputs.t }}
          RATE: ${{ inputs.rate }}
        run: python run.py --live "$STREAMER" --vod "$VOD" --t "$T" --rate "$RATE"

      - name: Tell your phone (only if you added NTFY_TOPIC)
        if: always()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          STREAMER: ${{ inputs.streamer }}
          RATE: ${{ inputs.rate }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          OUTCOME: ${{ job.status }}
        run: |
          [ -z "$NTFY_TOPIC" ] && exit 0
          python - <<'PY'
          import glob, json, os, urllib.request
          meta = {}
          for f in sorted(glob.glob("output/*.json")):
              meta = json.load(open(f))
          s, rate = os.environ["STREAMER"], os.environ.get("RATE") or "?"
          if meta:
              title = f"New live clip: {s}"
              body = (meta.get("what_happened") or meta.get("title", "")) + \
                     f"\nChat: {rate}/min per 1,000 viewers. Layout: {meta.get('layout', '?')}." + \
                     (f"\nPosted: https://youtube.com/shorts/{meta['video_id']}" if meta.get("video_id")
                      else "\nNot posted (live.post is off): download it from the run.")
          elif os.environ["OUTCOME"] == "success":
              title, body = f"Live moment skipped: {s}", "Already had a Short today, or the moment wasn't usable."
          else:
              title, body = f"Clip now failed: {s}", "Open the run to see why."
          req = urllib.request.Request(f"https://ntfy.sh/{os.environ['NTFY_TOPIC']}", data=body.encode(),
                                       headers={"Title": title, "Click": os.environ["RUN_URL"], "Tags": "movie_camera"})
          urllib.request.urlopen(req, timeout=20)
          PY

      - name: Keep the video as a download
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-short
          if-no-files-found: ignore
          path: output/
          retention-days: 7

      - name: Save state
        if: always()
        run: |
          git config user.name "clipper-bot"
          git config user.email "clipper-bot@users.noreply.github.com"
          # merge with what's on GitHub now (the live watcher may have posted meanwhile)
          cp state.json "$RUNNER_TEMP/mine.json"
          for i in 1 2 3 4; do
            git fetch -q origin main && git reset -q --hard origin/main
            python statemerge.py "$RUNNER_TEMP/mine.json" state.json
            git add state.json
            git diff --cached --quiet && break
            git commit -qm "Update posted clips (live)" && git push -q origin HEAD:main && break
            sleep $((i * 5))
          done
