name: Live clips

# A constant eye on the streamers' live streams (see live.py). Each run watches
# for up to live.max_minutes (under GitHub's 6-hour limit). It starts every
# hour; while one run is watching, the next waits in line and takes over the
# moment it ends, so there's only a few minutes' gap every ~6 hours.
# Settings are under `live:` in config.yaml (post: false = make videos only).
on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: "How long to watch (minutes, up to 320)"
        default: "120"
      streamer:
        description: "Which streamer (all = whoever is live)"
        type: choice
        options: [all, caseoh_, ohnepixel, kaicenat, jynxzi, typicalgamer]
        default: all
      dry_run:
        description: "Make the videos but don't upload them"
        type: boolean
        default: true

permissions:
  contents: write   # to save state.json

concurrency:
  group: live
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Is live clipping on?
        id: live
        run: |
          pip install -q pyyaml
          python -c "import yaml; c=yaml.safe_load(open('config.yaml')); print('live=' + ('yes' if (c.get('live') or {}).get('enabled', True) else ''))" >> "$GITHUB_OUTPUT"

      - name: Install ffmpeg
        if: steps.live.outputs.live == 'yes'
        timeout-minutes: 5
        run: |
          curl -sSL --retry 3 -o ffmpeg.tar.xz https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
          mkdir -p "$HOME/ffmpeg" && tar -xf ffmpeg.tar.xz -C "$HOME/ffmpeg" --strip-components=1
          echo "$HOME/ffmpeg/bin" >> "$GITHUB_PATH"

      - name: Install Python packages
        if: steps.live.outputs.live == 'yes'
        timeout-minutes: 10
        run: pip install -r requirements.txt

      - name: Install TwitchDownloaderCLI (for clips of the live stream)
        if: steps.live.outputs.live == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download -R lay295/TwitchDownloader -p "*CLI*Linux-x64.zip" -O tdl.zip
          unzip -o tdl.zip TwitchDownloaderCLI && chmod +x TwitchDownloaderCLI

      - name: Install Claude Code (only if you added CLAUDE_CODE_OAUTH_TOKEN)
        env:
          HAS_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        if: steps.live.outputs.live == 'yes' && env.HAS_TOKEN == 'true'
        run: npm install -g @anthropic-ai/claude-code

      - name: Cache subtitle model
        if: steps.live.outputs.live == 'yes'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small

      - name: Watch and clip
        if: steps.live.outputs.live == 'yes'
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          TWITCHDOWNLOADER_CLI: ./TwitchDownloaderCLI
          PYTHONUNBUFFERED: "1"
        run: |
          args=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            args="--minutes ${{ inputs.minutes }} --streamer ${{ inputs.streamer }}"
            [ "${{ inputs.dry_run }}" = "true" ] && args="$args --dry-run"
          fi
          python live.py $args

      - name: Keep the videos as a download
        if: always() && steps.live.outputs.live == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: live-shorts
          if-no-files-found: ignore
          path: output/
          retention-days: 7

      - name: Save state
        if: always() && steps.live.outputs.live == 'yes'
        run: |
          git config user.name "clipper-bot"
          git config user.email "clipper-bot@users.noreply.github.com"
          cp state.json "$RUNNER_TEMP/mine.json"
          for i in 1 2 3 4; do
            git fetch -q origin main && git reset -q --hard origin/main
            python statemerge.py "$RUNNER_TEMP/mine.json" state.json
            git add state.json
            git diff --cached --quiet && break
            git commit -qm "Update posted clips (live)" && git push -q origin HEAD:main && break
            sleep $((i * 5))
          done
