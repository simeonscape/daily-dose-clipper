name: Daily clips

on:
  schedule:
    # Every hour. The "check" job below only goes ahead when one of the
    # post_times in config.yaml is coming up, so most runs stop after a few seconds.
    - cron: "10 * * * *"
  workflow_dispatch:
    inputs:
      clips:
        description: "How many Shorts to make"
        type: choice
        options: ["1", "2", "3", "5"]
        default: "1"
      streamer:
        description: "Which streamer (all = one Short each, up to the number above)"
        type: choice
        options: [all, caseoh_, ohnepixel, kaicenat, jynxzi, typicalgamer]
        default: all
      dry_run:
        description: "Make the video but don't upload it"
        type: boolean
        default: true

permissions:
  contents: write   # to save state.json (which moments were already posted)

concurrency:
  group: clipper
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      slot: ${{ steps.slot.outputs.slot }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main      # the latest state.json, even if this run waited in line
      - name: Is a posting time coming up?
        id: slot
        run: |
          pip install -q pyyaml tzdata
          echo "slot=$(python slots.py)" >> "$GITHUB_OUTPUT"

  clip:
    needs: check
    if: github.event_name == 'workflow_dispatch' || needs.check.outputs.slot != ''
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ffmpeg
        timeout-minutes: 5
        run: |
          # A ready-made ffmpeg build (with subtitles support). Much faster than apt-get.
          curl -sSL --retry 3 -o ffmpeg.tar.xz https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
          mkdir -p "$HOME/ffmpeg" && tar -xf ffmpeg.tar.xz -C "$HOME/ffmpeg" --strip-components=1
          echo "$HOME/ffmpeg/bin" >> "$GITHUB_PATH"
          "$HOME/ffmpeg/bin/ffmpeg" -hide_banner -filters | grep -q subtitles

      - name: Install Python packages
        timeout-minutes: 10
        run: pip install -r requirements.txt

      - name: Install TwitchDownloaderCLI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download -R lay295/TwitchDownloader -p "*CLI*Linux-x64.zip" -O tdl.zip
          unzip -o tdl.zip TwitchDownloaderCLI && chmod +x TwitchDownloaderCLI

      - name: Install Claude Code (only if you added CLAUDE_CODE_OAUTH_TOKEN)
        env:
          HAS_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        if: env.HAS_TOKEN == 'true'
        run: npm install -g @anthropic-ai/claude-code

      - name: Cache subtitle model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small

      - name: Reuse chats downloaded by earlier runs (only needed when a streamer has no clips)
        uses: actions/cache@v4
        with:
          path: work/chat_*.json
          key: chats-${{ github.run_id }}
          restore-keys: chats-

      - name: Make and post Shorts
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          TWITCHDOWNLOADER_CLI: ./TwitchDownloaderCLI
          PYTHONUNBUFFERED: "1"
        run: |
          args="--slot ${{ needs.check.outputs.slot }}"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            args="--clips ${{ inputs.clips }} --streamer ${{ inputs.streamer }}"
            [ "${{ inputs.dry_run }}" = "true" ] && args="$args --dry-run"
          fi
          python run.py $args

      - name: Keep the video as a download
        uses: actions/upload-artifact@v4
        with:
          name: shorts
          path: output/
          retention-days: 7

      - name: Save state
        if: always()
        run: |
          git config user.name "clipper-bot"
          git config user.email "clipper-bot@users.noreply.github.com"
          git add state.json
          if ! git diff --cached --quiet; then
            git commit -m "Update posted clips"
            git pull --rebase -X theirs origin main
            git push
          fi
