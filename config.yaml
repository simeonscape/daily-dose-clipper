channel_name: Daily Dose of Streamers

# How many Shorts each scheduled run makes (a manual run can pick 1, 2, 3 or 5).
# Every run looks at all streamers and takes the most viral moments: the
# biggest chat spikes, ranked higher the more chat spammed LOL (KEKW, LMAO,
# OMEGALUL, 💀...) and CLIP IT.
clips_per_run: 1
max_per_streamer: 2       # per run, so one streamer can't take every slot
max_uploads_per_day: 6    # YouTube's free API quota allows about 6 uploads a day
vods_per_streamer: 2      # how many recent finished streams to look through

# Clip window around a chat spike
before_s: 30        # seconds before the spike
after_s: 30         # seconds after the spike
chat_delay_s: 6     # chat reacts a few seconds after the moment, so shift back
min_spike_score: 3.0

quality: 1080p60
whisper_model: small   # tiny / base / small / medium (bigger = better subtitles, slower)
privacy: public        # set to private to check videos before they go live

# Layout is automatic: if the stream has a facecam, the camera goes on top and
# the whole screen below. A full-screen camera or no camera gets one big panel.
# Each run also saves <clip>_camera.jpg showing what it found (green box).
# If it picks the wrong spot for a streamer, set it by hand:
#   cam: [x, y, width, height]   # fractions of the screen, e.g. [0, 0.25, 0.25, 0.3]
#   layout: game                 # or cam, to force one big panel
# Check each login on twitch.tv. A streamer with no Twitch VODs is skipped.
streamers:
