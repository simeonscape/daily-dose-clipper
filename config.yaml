channel_name: Daily Dose of Streamers

# Clip window around a chat spike
before_s: 30        # seconds before the spike
after_s: 30         # seconds after the spike
chat_delay_s: 6     # chat reacts a few seconds after the moment, so shift back
min_spike_score: 3.0

quality: 1080p60
whisper_model: small   # tiny / base / small / medium (bigger = better subtitles, slower)
privacy: public        # set to private to check videos before they go live

# crop: center43 (default), square, or full (whole 16:9 frame)
# Check each login on twitch.tv. Streamers who mainly stream on YouTube or Kick
# need another source, so they're turned off until that's added.
