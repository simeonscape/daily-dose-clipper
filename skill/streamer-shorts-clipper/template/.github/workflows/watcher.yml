name: Live watcher

# Always on: reads the streamers' live chats every second and, when one
# explodes, starts "Clip now" for that moment (see watcher.py). GitHub ends a
# run after about 6 hours, so near the end each run starts its replacement and
# keeps watching until the new one is warmed up: no gap. The 15-minute
# schedule is only a safety net (after a crash); those runs stop at once when
# a watcher is already running. Nothing to fill in.
# Turn it off with live.enabled: false in config.yaml.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      handover:
        description: "Started by the previous watcher run (leave off)"
        type: boolean
        default: false

run-name: "${{ inputs.handover && 'Live watcher (handover)' || 'Live watcher' }}"

permissions:
  contents: read    # to see who already got a Short today (state.json)
  actions: write    # to start "Clip now" and the next watcher run

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests pyyaml tzdata
      - name: Watch chats
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONUNBUFFERED: "1"
          HANDOVER: ${{ inputs.handover && '1' || '' }}
        run: python watcher.py ${HANDOVER:+--handover}
